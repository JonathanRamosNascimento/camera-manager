<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232b"/>
      <stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#b8bec9"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- braço de fixação -->
  <path d="M86 74 v14 a6 6 0 0 1-6 6 h-6" fill="none" stroke="#6b7280"
        stroke-width="6" stroke-linecap="round"/>
  <rect x="60" y="90" width="26" height="8" rx="4" fill="#6b7280"/>

  <!-- corpo da câmera, levemente inclinado -->
  <g transform="rotate(-12 70 56)">
    <rect x="30" y="40" width="62" height="32" rx="9" fill="url(#body)"/>
    <rect x="86" y="46" width="12" height="20" rx="4" fill="#8e97a5"/>
    <!-- lente -->
    <circle cx="46" cy="56" r="11" fill="#1b1d24"/>
    <circle cx="46" cy="56" r="6.5" fill="#2f6fd0"/>
    <circle cx="43.4" cy="53.4" r="2.4" fill="#eaf2ff" fill-opacity="0.9"/>
    <!-- LED de gravação -->
    <circle cx="76" cy="48" r="3.6" fill="#4ade80"/>
  </g>
</svg>
